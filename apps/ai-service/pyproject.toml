[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workforce-ai-service"
version = "1.0.0"
description = "Standalone AI, RAG, embedding and agent runtime for AI Workforce"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic-settings==2.3.4",
  "httpx==0.27.0",
  "pypdf==5.9.0",
]

[project.optional-dependencies]
huggingface = [
  "sentence-transformers>=5.1,<6.0",
  "transformers>=4.51,<6.0",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
